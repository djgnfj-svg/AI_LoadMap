# Windows(Docker Desktop)에서 이 한 줄로 띄운다:
#
#   docker compose up -d --build
#
# 터널까지 같이 띄우려면 (.env 에 CLOUDFLARE_TUNNEL_TOKEN 을 넣고):
#
#   docker compose --profile tunnel up -d --build
#
# ⚠ Windows 절전을 끈다. 자면 APScheduler 가 멈추고 실패 감지가 죽는다 (TODO §14).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-roadmap_planner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 호스트로는 안 연다. 앱이 같은 네트워크 안에서 붙는다.
    # DB 를 직접 들여다보려면 아래를 풀거나 `docker compose exec db psql -U postgres` 를 쓴다.
    # ports: ["5432:5432"]
    healthcheck:
      # 앱이 뜨자마자 붙기 때문에, DB 가 받을 준비가 됐는지 먼저 확인해야 한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-roadmap_planner}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${DB_NAME:-roadmap_planner}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      USE_MOCK_PLANNER: ${USE_MOCK_PLANNER:-false}
      # 비우면 재시작마다 로그인이 풀린다. 반드시 채운다:
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 을 .env 에 넣어라}
      # 터널이 HTTPS 를 종료해 주므로 켠다. 로컬 http 로만 볼 때는 false.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # ⚠ 값이 들어오는 순간 데모 로그인 문이 닫힌다.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # 프론트를 같은 오리진에서 서빙하므로 CORS 가 필요 없다. 빈 값이 기본.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TZ: ${TZ:-Asia/Seoul}
      # 스케줄러가 00:10 · 00:20 · 09:00 에 도는데, TZ 가 없으면 UTC 로 돈다 (9시간 밀린다).
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

  # named tunnel. Quick Tunnel 은 GET SSE 가 버퍼링되는 이슈가 있다 (TODO §14).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?터널 토큰이 필요하다}
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
